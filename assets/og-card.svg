<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Novella Nora — writings by Nora Casey">
  <!-- The card an unfurl shows. Source for public/og.png; run `npm run images`
       after changing it. Paper, ink, rule, muted and accent are the site's own
       (src/styles/global.css), and the face is the site's own serif, vendored in
       assets/fonts — a card that does not look like the page it links to is
       worse than no card.

       Everything sits between y=96 and y=540. Twitter crops a large card to
       2:1, taking fifteen pixels off each edge, so nothing may come closer than
       that to the top or the bottom. -->
  <rect width="1200" height="630" fill="#fbf8f3"/>

  <!-- The same mark as public/favicon.svg, at 32/32 scaled to 88. -->
  <g transform="translate(100 96) scale(2.75)">
    <rect width="32" height="32" rx="6" fill="#9b6b3f"/>
    <path d="M9 24V8h4l6 9.5V8h4v16h-4l-6-9.5V24z" fill="#fbf8f3"/>
  </g>

  <text x="100" y="330" font-family="Source Serif 4" font-size="92" fill="#1a1a1a" letter-spacing="-1">Novella Nora</text>
  <rect x="100" y="382" width="1000" height="1" fill="#d8d4cb"/>
  <text x="100" y="444" font-family="Source Serif 4" font-size="38" fill="#6b6454">Writings by Nora Casey</text>
  <text x="100" y="540" font-family="Source Serif 4" font-size="24" fill="#9b6b3f" letter-spacing="3">NOVELLANORA.COM</text>
</svg>
