name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push while the first is still running has nothing left to prove: the older commit
# is already superseded. Cancel it rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Measured at 12s locally on 14 September (M-series, warm install). Ten minutes is far
    # more than that on purpose — a cold runner and a cold npm cache are the common case, and
    # a timeout tight enough to fire on a slow day skips the deploy and looks like a pass.
    # Revisit from a real CI number once there is one; a laptop does not predict a runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # One command, the same one `npm run gate` runs locally, so CI and a laptop cannot
      # disagree about what passing means. It is formatting, then lint, then typecheck, then
      # the unit tests, then the build — cheap checks first, so a misformatted file fails in
      # under a second rather than after a compile.
      - run: npm run gate

  # This job is the only thing that ships `main` to production, and it runs only after the
  # gate passes. It has been live since 14 Sep 2026: ENABLE_VERCEL_DEPLOY is `true`, the three
  # VERCEL_* secrets are set, and `vercel.json` turns off Vercel's own Git deploys for `main`
  # (branch previews still deploy from Git).
  #
  # Turning the Git deploys back on for `main` would reproduce CruciNora's OPS-1 exactly.
  # There, the bot put a commit in front of users 33 seconds before the gated deploy ran, on
  # every push in the repo's history, so a failing test would have skipped the Actions
  # deploy while the broken commit was already live.
  #
  # To confirm there is still a single deployer:
  #   gh api repos/norarcasey/novellanora-site/deployments
  # should show no vercel[bot] Production row newer than 8e25bd7 (14 Sep). The list does not
  # show this job: `vercel deploy` from the CLI records no GitHub deployment. To see that the
  # job shipped a commit, look at this job's run.
  #
  # The variable stays as a kill switch. Setting it to anything but `true` skips the job
  # and leaves CI green, and then nothing deploys `main` at all.
  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.ENABLE_VERCEL_DEPLOY == 'true'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
