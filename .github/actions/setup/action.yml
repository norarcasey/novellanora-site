name: Set up the workspace
description: >
  Node, npm, and an install. Shared by every job so they cannot drift apart — three jobs
  each naming their own Node version is three chances to be on different ones.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Install
      shell: bash
      # `ci`, not `install`: it installs exactly the lockfile and fails if package.json and
      # the lock have drifted, which is the difference between a reproducible run and one
      # that quietly resolved something newer than what was tested here.
      run: npm ci
